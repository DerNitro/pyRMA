[project]
name = "pyrma"
version = "2.0.0"
description = "Remote access control system for server and network equipment"
readme = "README.rst"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "wtforms>=3.0.1",
    "Flask-WTF>=1.1.1",
    "Flask-RESTful>=0.3.9",
    "Flask-HTTPAuth>=4.8.1",
    "psutil>=5.9.0",
    "email-validator>=1.2.1",
    "python-pam>=2.0.2",
    "sshtunnel>=0.4.0",
    "python-iptables>=1.0.0",
    "pysftp>=0.2.9",
    "checksumdir>=1.2.0",
    "markdown>=3.8.1",
    "passlib>=1.7.4",
    "npyscreen>=4.10.5",
    "ansible>=12.2.0",
    "ansible-lint>=5.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-sqlalchemy-mock>=0.1.5",
    "ruff>=0.17.3",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyrmalib*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
