# Настройки линтера Ruff для проекта pyRMA
# Все комментарии и пояснения в конфигурационных файлах и коде должны быть на русском языке.

# Исключения для проверки (файлы и директории, которые не нужно линтить)
exclude = [
    ".git",
    ".idea",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "venv",
    "schema/versions",  # Автосгенерированные миграции Alembic
    "build",
    "dist",
]

# Длина строки (совпадает со стандартными соглашениями)
line-length = 100

[lint]
# Включенные группы правил (select):
# E, W - ошибки и предупреждения pycodestyle
# F - ошибки Pyflakes (неиспользуемые импорты, переменные и т.д.)
# I - сортировка импортов (isort)
# UP - обновление синтаксиса под новые версии Python
select = ["E", "W", "F", "I", "UP"]

# Исключенные конкретные правила (ignore), если требуется подавить специфичные предупреждения
ignore = [
    "E501",  # Ограничение длины строки обрабатывается форматированием или допускается в исключениях
]

[lint.isort]
known-first-party = ["pyrmalib"]
